services:
  db:
    image: postgres:17-alpine
    container_name: ds1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ds1}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ds1password}
      POSTGRES_DB: ${DB_NAME:-ds1}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
